<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="하루">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <title>하루 캘린더</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-row">
        <h1 id="title" class="title" role="button" tabindex="0" aria-label="날짜로 이동"></h1>
        <div class="top-actions">

          <button id="todayBtn" class="chip" type="button">오늘</button>
          <button id="shareBtn" class="icon-btn share-btn" type="button" aria-label="일정 공유">
            <span class="share-label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6L12 3L9 6M12 3V13M7 10C6.068 10 5.602 10 5.235 10.152C4.99218 10.2525 4.77155 10.3999 4.58572 10.5857C4.3999 10.7716 4.25251 10.9922 4.152 11.235C4 11.602 4 12.068 4 13V17.8C4 18.92 4 19.48 4.218 19.908C4.40974 20.2843 4.71569 20.5903 5.092 20.782C5.519 21 6.079 21 7.197 21H16.804C17.922 21 18.481 21 18.908 20.782C19.284 20.59 19.59 20.284 19.782 19.908C20 19.48 20 18.921 20 17.803V13C20 12.068 20 11.602 19.848 11.235C19.7475 10.9922 19.6001 10.7716 19.4143 10.5857C19.2284 10.3999 19.0078 10.2525 18.765 10.152C18.398 10 17.932 10 17 10"/></svg>공유</span>
          </button>
          <button id="settingsBtn" class="icon-btn" type="button" aria-label="설정">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="main"></main>
  </div>

  <nav class="tabbar" role="tablist" aria-label="보기">
    <button type="button" class="tab" data-view="month" role="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M 7 1 C 6.448 1 6 1.448 6 2 L 6 3 L 5 3 C 3.9 3 3 3.9 3 5 L 3 19 C 3 20.1 3.9 21 5 21 L 19 21 C 20.1 21 21 20.1 21 19 L 21 5 C 21 3.9 20.1 3 19 3 L 18 3 L 18 2 C 18 1.448 17.552 1 17 1 C 16.448 1 16 1.448 16 2 L 16 3 L 8 3 L 8 2 C 8 1.448 7.552 1 7 1 z M 5 8 L 19 8 L 19 19 L 5 19 L 5 8 z M 14 13 C 13.448 13 13 13.448 13 14 L 13 16 C 13 16.552 13.448 17 14 17 L 16 17 C 16.552 17 17 16.552 17 16 L 17 14 C 17 13.448 16.552 13 16 13 L 14 13 z"/></svg><span>월간</span></button>
    <button type="button" class="tab tab-add" id="addTab" aria-label="추가"><span class="add-circle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <button type="button" class="tab" data-view="week" role="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1.6"/><rect x="3" y="10" width="18" height="4" rx="1.6"/><rect x="3" y="16" width="18" height="4" rx="1.6"/></svg><span>주간</span></button>
  </nav>

  <div id="sheetRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
